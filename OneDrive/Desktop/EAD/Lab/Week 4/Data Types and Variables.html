<!DOCTYPE html>
<html>
<head>
    <title>Data Types and Variables</title>

    <style>
        .top-right {
            position: absolute;
            top: 10px;
            right: 20px;
            text-align: right;
            font-family: Arial;
        }
    </style>

</head>

<body>

    <div class="top-right">
        <h4>Name: Damodara Lakshmi Madhulika</h4>
        <h4>Roll No: 160124737144</h4>
    </div>

    <script>
        var rollNo = 160124737144;
        let branch = "CBIT-IT";

        const pass = true;
        const name = "Damodara Lakshmi Madhulika";

        console.log("Name:", name);
        console.log("Roll No:", rollNo);
        console.log("Branch:", branch);
        console.log("Is Pass:", pass);

        if (true) {
            var a = "var scope";
            let b = "let scope";
            const c = "const scope";

            console.log(a, b, c);
        }

        console.log(a);
    </script>

</body>
</html>
