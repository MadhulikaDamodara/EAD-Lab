<!DOCTYPE html>
<html>
<head>
    <title>Chessboard</title>
    <style>
        .board {
            width: 320px;
            display: grid;
            grid-template-columns: repeat(8, 40px);
            border: 3px solid black;          /* Outer border */
        }
        .white {
            width: 40px;
            height: 40px;
            background-color: white;
            border: 1px solid black;          /* Cell border */
            box-sizing: border-box;           /* Prevent size distortion */
        }
        .black {
            width: 40px;
            height: 40px;
            background-color: black;
            border: 1px solid black;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<p><b>Name:</b> Damodara Lakshmi Madhulika</p>
<p><b>Roll No:</b> 160124737144</p>
<h2>Chess Board</h2>
<div class="board">
    <!-- Row 1 -->
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <!-- Row 2 -->
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <!-- Row 3 -->
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <!-- Row 4 -->
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <!-- Row 5 -->
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <!-- Row 6 -->
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <!-- Row 7 -->
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <div class="white"></div><div class="black"></div>
    <!-- Row 8 -->
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
    <div class="black"></div><div class="white"></div>
</div>
</body>
</html>
